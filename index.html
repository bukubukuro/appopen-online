<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>appopen.online | Ultra-Light Tent Select</title>
    <style>
        /* ベーススタイル */
        :root {
            --bg-color: #f9f9f6;
            --text-color: #2c302e;
            --accent-color: #5b7065;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ヘッダー */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid #e6e6e2;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.4rem;
            margin: 0;
            letter-spacing: 0.05em;
        }

        header h1 a {
            color: var(--text-color);
            text-decoration: none;
        }

        /* ヒーローセクション */
        .hero {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(rgba(249, 249, 246, 0.8), rgba(249, 249, 246, 0.9)), 
                        url('https://images.unsplash.com/photo-1510312305653-8ed496efae75?auto=format&fit=crop&w=1200&q=80') no-repeat center/cover;
            margin-bottom: 40px;
        }

        .hero h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .hero p {
            font-size: 1.1rem;
            color: #606662;
            max-width: 600px;
            margin: 0 auto;
        }

        /* コンテンツセクション */
        .section-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 40px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 40px;
            height: 2px;
            background-color: var(--accent-color);
            margin: 10px auto 0;
        }

        /* テントカードグリッド */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #e6e6e2;
        }

        .card-content {
            padding: 25px;
        }

        .card-tag {
            display: inline-block;
            background-color: #f0f2f0;
            color: var(--accent-color);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .card-title {
            font-size: 1.3rem;
            margin: 0 0 10px 0;
        }

        .card-specs {
            list-style: none;
            padding: 0;
            margin: 15px 0 0 0;
            border-top: 1px solid #f0f2f0;
            padding-top: 15px;
            font-size: 0.9rem;
            color: #606662;
        }

        .card-specs li {
            margin-bottom: 5px;
        }

        /* フッター */
        footer {
            background-color: #2c302e;
            color: #a4a8a5;
            text-align: center;
            padding: 30px 0;
            font-size: 0.85rem;
            margin-top: 60px;
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <h1><a href="#">appopen.online</a></h1>
        </div>
    </header>

    <section class="hero">

    </section>
